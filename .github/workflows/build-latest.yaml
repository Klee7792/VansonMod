name: Build Latest (with roothide support)

# 👇 只保留手动触发，没有自动触发
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install all dependencies
        run: |
          brew update
          brew install make dpkg ldid libplist openssl

      - name: Clone latest Theos (full)
        run: |
          sudo rm -rf /opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $USER /opt/theos

      - name: Get version
        id: version
        run: |
          VER=$(grep Version control | awk '{print $2}')
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          mkdir -p packages_final

      # ========== 1. rootful (deb + tipa) ==========
      - name: Build rootful
        env:
          THEOS: /opt/theos
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make clean package DEBUG=0
          mv packages/*.deb packages_final/VansonMod_${{ steps.version.outputs.VERSION }}_rootful.deb
          mv packages/*.tipa packages_final/VansonMod_${{ steps.version.outputs.VERSION }}_TrollStore.tipa

      # ========== 2. rootless ==========
      - name: Build rootless
        env:
          THEOS: /opt/theos
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make clean package DEBUG=0 THEOS_PACKAGE_SCHEME=rootless SKIP_TIPA=1
          mv packages/*.deb packages_final/VansonMod_${{ steps.version.outputs.VERSION }}_rootless.deb

      # ========== 3. roothide（最新Theos已支持） ==========
      - name: Build roothide
        continue-on-error: true
        env:
          THEOS: /opt/theos
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make clean package DEBUG=0 THEOS_PACKAGE_SCHEME=roothide SKIP_TIPA=1
          mv packages/*.deb packages_final/VansonMod_${{ steps.version.outputs.VERSION }}_roothide.deb

      # ========== 上传全部产物 ==========
      - name: Upload all
        uses: actions/upload-artifact@v4
        with:
          name: VansonMod_All_v${{ steps.version.outputs.VERSION }}
          path: packages_final/
          retention-days: 7
